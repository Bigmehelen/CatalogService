
services:
  postgres:
    image: postgres:16
    container_name: shared-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    restart: unless-stopped

  catalog-service:
    build: ./CatalogService
    container_name: catalog-service
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/catalog_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
    depends_on:
      - postgres
    restart: unless-stopped

  user-service:
    build: ./UserService
    container_name: user-service
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/user_db?schema=public
      - JWT_SECRET=super_secret_jwt_key_2024
      - CATALOG_SERVICE_URL=http://catalog-service:8080
    depends_on:
      - postgres
    restart: unless-stopped


volumes:
  postgres-data:
